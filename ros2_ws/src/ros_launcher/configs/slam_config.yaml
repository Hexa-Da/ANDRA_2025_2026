# slam_config.yaml — sync_slam_toolbox_node (Cartographie)
slam_toolbox:
  ros__parameters:
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan

    use_sim_time: false
    # TG15 : aligner avec ydlidar_TG15.yaml (range_min 0.5, range_max 15.0)
    min_laser_range: 0.5
    max_laser_range: 15.0
    # Ne pas sous-échantillonner trop fort (lidar ~5 Hz)
    minimum_time_interval: 0.25
    map_update_interval: 2.0
    transform_timeout: 1.0
    tf_buffer_duration: 30.0

    # Défaut interne souvent 0,5 m / 0,5 rad → peu de nouveaux en petit déplacement
    minimum_travel_distance: 0.20
    minimum_travel_heading: 0.20

    mode: mapping
    debug_logging: false
    throttle_scans: 1
    resolution: 0.05
    use_scan_matching: true

    # Preset conservateur v2 : map plus stable en ligne droite
    # (quitte à accepter un peu de dérive si l'odom est imparfait).
    position_covariance_scale: 6.0
    yaw_covariance_scale: 6.0
    # Matching plus sélectif → moins de micro-corrections bruitées.
    link_match_minimum_response_fine: 0.50
    loop_match_minimum_response_fine: 0.60
    # Pénalités : décourage les grosses corrections éloignées de l'odom.
    minimum_distance_penalty: 1.0
    minimum_angle_penalty: 0.9

    # Anti-glissement couloir : limite la marge de recherche du scan matcher,
    # de sorte que SLAM ne puisse pas "glisser" librement le long des murs parallèles.
    correlation_search_space_dimension: 0.3
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.03
